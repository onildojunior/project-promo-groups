version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-django_db}
      MYSQL_USER: ${MYSQL_USER:-django_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-django_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - django_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: django_app
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    environment:
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      DATABASE_URL: ${DATABASE_URL:-mysql://django_user:django_password@db:3306/django_db}
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-django_db}
      MYSQL_USER: ${MYSQL_USER:-django_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-django_password}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - django_network

  nginx:
    build:
      context: ./nginx
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot
    depends_on:
      - web
    networks:
      - django_network

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/www/certbot

volumes:
  mysql_data:
  static_data:
  media_data:
  certbot_etc:
  certbot_var:

networks:
  django_network:
    driver: bridge
