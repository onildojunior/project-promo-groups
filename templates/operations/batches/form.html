{% extends 'base.html' %}

{% block title %}Formulario de lote | Promo Groups{% endblock %}

{% block content %}
<section class="card">
    <h2>{% if object %}Editar lote{% else %}Novo lote{% endif %}</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {% include 'operations/partials/form_fields.html' %}
        <div class="button-row">
            <button type="submit" class="button">Salvar</button>
            <a class="button secondary" href="{% url 'operations:batches-list' %}">Cancelar</a>
            {% if object %}
                <a class="button secondary" href="{% url 'operations:batches-delete' object.pk %}">Excluir</a>
            {% endif %}
        </div>
    </form>
</section>
{% endblock %}
