{% if form.non_field_errors %}
    <div class="alert error">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
    <label>
        {{ field.label }}
        {{ field }}
        {% if field.help_text %}
            <small>{{ field.help_text }}</small>
        {% endif %}
        {% for error in field.errors %}
            <small class="error-text">{{ error }}</small>
        {% endfor %}
    </label>
{% endfor %}
